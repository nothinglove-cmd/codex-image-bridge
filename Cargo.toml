[package]
name = "codex-image-fix"
version = "0.4.6"
edition = "2021"
rust-version = "1.86"
description = "Comidea Codex Image Bridge restores generated images in Codex Desktop chats on Windows"
homepage = "https://comidea.org"
repository = "https://github.com/nothinglove-cmd/codex-image-bridge"
publish = false
autobins = false

[[bin]]
name = "CodexImageFix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
toml_edit = "0.23"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
